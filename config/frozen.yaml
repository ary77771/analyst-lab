# Every number the detection and investigation use, in ONE place (fair-test rule 2,
# docs/plans/hard-part-plan.md). Values are chosen on DEV data only, each with its reason.
# The git tag `freeze-v1` (then `freeze-v2`) fixes this file before any TEST data is evaluated and before the blind
# scenarios are opened; changing a value after that means a new tag and saying so in the report.
#
# null = not chosen yet. Code must refuse to run an official evaluation while a value it needs
# is null (engine code reads this file through one helper, added with the first package).

version: 3          # freeze-v3 (2026-11-14, docs/plans/v3-prereg.md); freeze-v2 (2026-11-13); freeze-v1 (2026-10-30)

data:
  dev_cutoff_day_utc: "2026-10-22"     # laptop days up to here = dev; from 2026-10-23 = test
  v2_test_from_day_utc: "2026-11-14"   # v2's own laptop test days: exactly these days (docs/plans/v2-prereg.md;
  v2_test_to_day_utc: "2026-11-20"     # set at freeze-v2: days recorded after the freeze, final Sysmon config v0.3)
  v3_test_from_day_utc: "2026-11-15"   # v3's own laptop test days (docs/plans/v3-prereg.md section 3): the 7 full
  v3_test_to_day_utc: "2026-11-21"     # days after freeze-v3; scored after 2026-11-22 00:00 UTC

sigma:
  rules_commit: e3f466211866e92553d8389d621ed13cfed5523d   # SigmaHQ, tools/fetch_sigma_rules.ps1
  min_level: medium                    # lowest level that raises an alert (Yousif 2026-10-23, after the dev
                                       # false-alarm counts: informational 243/h, low 120/h, medium+ 3.06/h;
                                       # docs/results/c-dev-false-alarms.md). Lower levels stay in the store
                                       # for investigation; they just don't raise alerts.

declared_registry:                     # v4 F7 (engine/regcmd.py, engine/detect.py; docs/plans/v4-prereg.md section 5)
  reg_command: true                    # `reg add/delete <key> ...` on a reg.exe command line is offered to the
                                       # registry rules as the registry event it DECLARES (Sysmon here records
                                       # registry events only for autostart places). The alert cites the reg.exe
                                       # start and says "declared, not recorded"; never a stored event or graph fact.

declared_script:                       # v4 F8 (engine/pscmd.py, engine/detect.py; docs/plans/v4-prereg.md section 5)
  powershell_command: true             # the code on a powershell.exe command line (-Command, a bare first word,
                                       # -EncodedCommand decoded) is offered to SigmaHQ's PowerShell script rules
                                       # (ps_script, event 4104: we do not record PowerShell's own log) as the
                                       # script block it DECLARES. Same rules as F7: the alert cites the
                                       # powershell.exe start, says "declared, not recorded"; never stored.

