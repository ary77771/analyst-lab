# Scenario S2: regular check-ins. The TRUE STORY, written before the scenario code.
#
# Harmless by design: a program asks the lab's test server for a small text file 10 times,
# every 30 seconds, opening a NEW connection each time, then exits. Nothing is written, nothing
# is run. Runs ONLY inside the VM and talks ONLY to the lab's test server on the laptop.
# Written as patterns (names, counts, ranges), never as GUIDs, record numbers or exact times,
# because those differ on every run (DESIGN 7). The jitter variant is scenarios/s2j.

scenario: S2
title: Regular check-ins
runs_in: vm
test_server: "the lab test server: http://{test_server.ip}:{test_server.port}"   # as seen from the VM (NAT)

programs:
  checkin: s2_checkin.exe                 # started by the scenario runner (run_scenario.ps1)

# What happens, in order, and which recorded evidence should show it.
# count: exactly this many matching events; interval_seconds: the gap between consecutive
# matches (Sysmon's UtcTime) must lie within [min, max].
steps:
  - id: 1
    what: s2_checkin.exe starts
    evidence: {sysmon_event: 1, Image_endswith: s2_checkin.exe}
  - id: 2
    what: s2_checkin.exe contacts the test server 10 times, each over a NEW connection, 30 s apart
    evidence: {sysmon_event: 3, Image_endswith: s2_checkin.exe, DestinationIp: "{test_server.ip}",
               DestinationPort: "{test_server.port}", count: 10, interval_seconds: {min: 27, max: 33}}
  - id: 3
    what: s2_checkin.exe ends (5 s after its last check-in, so Sysmon can still name it in that last connection)
    evidence: {sysmon_event: 5, Image_endswith: s2_checkin.exe}

# Expected NOT to appear (absence is part of the true story)
not_expected:
  - {sysmon_event: 1, why: "the scenario's programs start no other program (review 2026-10-19)"}
  - {sysmon_event: 22, why: "the server is addressed by IP, so no DNS lookup happens"}
  - {sysmon_event: 11, why: "the program writes no files (checked where Sysmon records file creation: programs/scripts, Downloads, Startup, the AnalystLab folders)"}

notes:
  - Each check-in is a separate TCP connection (keep-alive off), so Sysmon records each one (A13).
    One long-lived connection would show up only once and hide the rhythm.
  - The interval range allows for the VM's slow-mode scheduling (a few hundred ms per
    connection); the program schedules every check-in from its start time, so delays don't add up.

# How the evidence graph should grade each relationship (DESIGN 4.7).
expected_graph:
  facts:
    - {from: checkin, edge: connected_to, to: test_server, count: 10,
       says: checkin connected to the test server 10 times}   # one event 3 each, carrying its ProcessGuid
  gaps: []                                   # its own start is recorded (started by the runner)

alert_expected:
  rule: periodic check-ins (RITA-style beacon scoring adapted to Sysmon, week 3)
  min_checkins: 10
  check:                                     # machine-readable (tools/check_alerts.py), added 2026-10-24
    - {rule_id: beacon, level: medium, involves: checkin}

# Assumptions this scenario checks (VERIFICATION_PLAN section 2)
checks_assumptions: [A13]
