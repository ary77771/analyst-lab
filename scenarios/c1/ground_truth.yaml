# Control scenario C1: a KNOWN UPDATER. The TRUE STORY, written before the run (decided by
# Yousif 2026-10-23: "known updater").
#
# A control, not an attack: it behaves exactly like S2 (the same check-in program, built under the
# updater's name c1_updater.exe: 10 check-ins to the lab's test server, 30 s apart, a new
# connection each time). The ONLY difference: this program and destination are on the lab's list
# of expected updaters (config/frozen.yaml beacon.expected), written down before the freeze, the way
# an analyst lists the updaters their organisation runs. (Scenario programs run without admin
# rights, so "installed under Program Files" can't be staged; the list is what makes it "known".)
# What C1 shows: the check-in rule still NOTICES the rhythm (nothing is hidden), but labels it
# "expected: listed updater" at level informational instead of a medium alert. Comparing S2 with C1
# isolates the effect of the list. Runs ONLY inside the VM, talks ONLY to the lab's test server.

scenario: C1
title: Known updater (control)
runs_in: vm
control: true
test_server: "the lab test server: http://{test_server.ip}:{test_server.port}"

programs:
  updater: c1_updater.exe                 # started by the scenario runner (run_scenario.ps1)

steps:
  - id: 1
    what: c1_updater.exe starts
    evidence: {sysmon_event: 1, Image_endswith: c1_updater.exe}
  - id: 2
    what: c1_updater.exe contacts the test server 10 times, each over a NEW connection, 30 s apart
    evidence: {sysmon_event: 3, Image_endswith: c1_updater.exe, DestinationIp: "{test_server.ip}",
               DestinationPort: "{test_server.port}", count: 10, interval_seconds: {min: 27, max: 33}}
  - id: 3
    what: c1_updater.exe ends
    evidence: {sysmon_event: 5, Image_endswith: c1_updater.exe}

not_expected:
  - {sysmon_event: 1, why: "it starts no other program"}
  - {sysmon_event: 22, why: "the server is addressed by IP, so no DNS lookup happens"}
  - {sysmon_event: 11, why: "it writes no files"}

expected_graph:
  facts:
    - {from: updater, edge: connected_to, to: test_server, count: 10,
       says: updater connected to the test server 10 times}
  gaps: []

alert_expected:
  rule: periodic check-ins (beacon)
  min_checkins: 10
  level: informational                     # noticed, labelled "expected: listed updater"
  check:                                     # machine-readable (tools/check_alerts.py), added 2026-10-24
    - {rule_id: beacon, level: informational, involves: updater}

checks_assumptions: [A13]
